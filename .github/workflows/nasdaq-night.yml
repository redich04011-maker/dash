name: nasdaq-night
on:
  push:
    branches: [ccr-4dc2bcfa-19dlf6]
    paths: ["nasdaq/**", ".github/workflows/nasdaq-night.yml"]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas scikit-learn
      - run: cd nasdaq && python regime.py && python last10.py
